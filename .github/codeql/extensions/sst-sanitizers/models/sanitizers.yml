extensions:
  # Model isSafeUrl() as a barrier guard: when isSafeUrl(url) returns true
  # in a conditional, the url argument is considered safe for the listed sinks.
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[isSafeUrl].Argument[0]", "true", "html-injection"]
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[isSafeUrl].Argument[0]", "true", "url-redirection"]
      # isSafeMediaSrc is defined locally in two files (DRY violation tracked
      # as a follow-up). Model both locations so CodeQL recognises the guard.
      - ["file:frontend/src/components/videoEditor/media.ts", "Member[isSafeMediaSrc].Argument[0]", "true", "html-injection"]
      - ["file:frontend/src/pages/ContentVideos.tsx", "Member[isSafeMediaSrc].Argument[0]", "true", "html-injection"]

  # Model sanitizeUrl()/sanitizeImageUrl() return values as barriers for
  # the same sinks (used in pass-through sanitizer pattern).
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[sanitizeUrl].ReturnValue", "html-injection"]
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[sanitizeUrl].ReturnValue", "url-redirection"]
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[sanitizeImageUrl].ReturnValue", "html-injection"]
      - ["file:frontend/src/lib/sanitizeUrl.ts", "Member[sanitizeImageUrl].ReturnValue", "url-redirection"]
